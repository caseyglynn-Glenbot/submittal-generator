# Render Blueprint — define the service so Render can deploy it from your repo.
# Once committed to GitHub, point Render at this file via "New Blueprint Instance".

services:
  - type: web
    name: submittal-generator
    runtime: docker
    plan: standard  # 2GB — end-of-pipeline compaction (fitz garbage + gs /ebook) peaks ~700MB-1.1GB; 512MB starter OOM-killed two-pool runs. Set via this file, NOT the dashboard (autoDeploy reverts dashboard changes on next push).
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true  # Render generates a random secret on first deploy
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true  # auto-redeploy on git push to main
